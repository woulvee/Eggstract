
license="${mod_license}"

#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

logoFile="assets/minecraft/optifine/cit/eggstractor_1.png" #optional
logoBlur=false

#credits="" #optional

authors="Woulvee"

description='''
Adds the Eggstracting Enchantment to Minecraft!
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}.jer.mixins.json"
requiredMods=["jeresources"]

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[29,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jeresources"
    type="optional"
    versionRange="[1.10,)"
    ordering="NONE"
    side="CLIENT"

